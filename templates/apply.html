<!DOCTYPE html>
<html>
<head>
  <title>Apply for Job</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; }
    h1 { color: #00ffcc; }
    form { background: #1e1e1e; padding: 20px; margin: auto; width: 40%; border-radius: 10px; }
    input { padding: 10px; margin: 10px; width: 80%; border-radius: 5px; border: none; }
    button { padding: 10px 20px; border: none; border-radius: 5px; background: #00ffcc; cursor: pointer; }
    button:hover { background: #00ccaa; }
  </style>
</head>
<body>
  <h1>Apply for {{ job['title'] }}</h1>
  <form method="post">
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="email" name="email" placeholder="Your Email" required><br>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
